<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Говоря — daily Bulgarian</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Говоря">
<style>
@font-face{font-family:"PT Sans";src:url(fonts/pt-sans-regular.woff2) format("woff2");font-weight:100 500;font-style:normal;font-display:swap}
@font-face{font-family:"PT Sans";src:url(fonts/pt-sans-bold.woff2) format("woff2");font-weight:600 900;font-style:normal;font-display:swap}
@font-face{font-family:"PT Sans";src:url(fonts/pt-sans-italic.woff2) format("woff2");font-weight:100 500;font-style:italic;font-display:swap}
@font-face{font-family:"PT Sans";src:url(fonts/pt-sans-bolditalic.woff2) format("woff2");font-weight:600 900;font-style:italic;font-display:swap}
@font-face{font-family:"PT Sans Narrow";src:url(fonts/pt-sans-narrow-bold.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Bad Script";src:url(fonts/bad-script.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  --paper:#F2F3F1; --card:#FFFFFF; --ink:#1E2329; --muted:#5D646D; --line:#D8DBD5;
  --red:#AE1F2C; --ochre:#C68A22; --pine:#2E5C4F; --pine-soft:#DCE8E3; --red-soft:#F5DEE0;
  --sans:"PT Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond:"PT Sans Narrow", "Arial Narrow", "PT Sans", system-ui, sans-serif;
  --hand:"Bad Script", cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181C; --card:#1C2227; --ink:#ECEDEA; --muted:#9BA2A9; --line:#2C333A;
    --red:#E25563; --ochre:#E0A84A; --pine:#7DB8A5; --pine-soft:#22332E; --red-soft:#3A2226;
  }
}
:root[data-theme="dark"]{
  --paper:#14181C; --card:#1C2227; --ink:#ECEDEA; --muted:#9BA2A9; --line:#2C333A;
  --red:#E25563; --ochre:#E0A84A; --pine:#7DB8A5; --pine-soft:#22332E; --red-soft:#3A2226;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px;border-radius:6px}
a{color:var(--pine)}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px 110px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:26px;line-height:1.1}
h3{font-size:19px}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* the one ornament: a cross-stitch band, as on Bulgarian шевица */
.stitch{height:14px;margin:2px 0 18px;
  background:
    linear-gradient(45deg,transparent 42%,var(--red) 42% 58%,transparent 58%) 0 0/14px 14px,
    linear-gradient(-45deg,transparent 42%,var(--red) 42% 58%,transparent 58%) 0 0/14px 14px;
  -webkit-mask:linear-gradient(90deg,#000 0 70%,transparent 70% 74%,#000 74% 78%,transparent 78% 82%,#000 82% 84%,transparent 84%);
          mask:linear-gradient(90deg,#000 0 70%,transparent 70% 74%,#000 74% 78%,transparent 78% 82%,#000 82% 84%,transparent 84%)}

.bg{font-family:var(--sans)}
.hw{font-family:var(--hand);font-weight:400;font-style:normal;color:var(--pine);letter-spacing:0;line-height:1.25}
.big+.hw,.day+.hw{margin-top:.15em}
.big+.hw{font-size:.42em}
.stage .hw.card{font-size:clamp(28px,8vw,44px)}
.stage .hw.card.s3{font-size:clamp(22px,6vw,30px)}
.item .hw{grid-column:1;font-size:19px}
.sent .hw{grid-column:2;font-size:19px}
.atable .hwl{font-family:var(--hand);font-size:30px;color:var(--pine);line-height:1}
.u{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:.09em;text-underline-offset:.14em}
.phon{color:var(--muted);font-style:italic}
.phon b{color:var(--ink);font-weight:800;font-style:italic}

/* Today */
.hero{padding:6px 0 4px}
.hero .day{font-family:var(--cond);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.01em}
.hero .hw{font-size:34px;margin-top:8px}
.hero .sub{color:var(--muted);margin-top:6px}
.counts{display:flex;gap:28px;margin:22px 0 18px}
.counts div{display:flex;flex-direction:column}
.counts strong{font-family:var(--cond);font-size:44px;line-height:1}
.counts span{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:15px 20px;font-weight:600;font-size:17px;background:var(--ink);color:var(--paper);min-height:52px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--pine-soft);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.tip{margin-top:26px;border-left:3px solid var(--ochre);padding:4px 0 4px 14px}
.tip h3{font-size:16px;margin-bottom:2px}
.week{display:flex;gap:6px;margin-top:22px}
.week i{flex:1;height:34px;border-radius:6px;background:var(--line);position:relative}
.week i.on{background:var(--pine)}
.week i em{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-style:normal;font-size:12px;color:var(--muted)}

/* Study */
.study{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.study-top{display:flex;align-items:center;gap:12px;padding:12px 18px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pine);transition:width .25s}
.x{border:0;background:transparent;font-size:15px;color:var(--muted);padding:8px}
.stage{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center;padding:10px 22px;max-width:560px;width:100%;margin:0 auto}
.kind{font-size:14px;color:var(--muted);margin-bottom:10px}
.big{font-family:var(--cond);font-weight:800;line-height:1;letter-spacing:-.005em;word-break:break-word}
.big.s1{font-size:clamp(56px,19vw,104px)}
.big.s2{font-size:clamp(40px,12vw,72px)}
.big.s3{font-size:clamp(30px,8.5vw,48px);line-height:1.08}
.big .u{text-decoration-thickness:.07em}
.en-big{font-size:clamp(26px,7vw,36px);font-weight:600;line-height:1.15}
.reveal{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.reveal .phon{font-size:22px}
.reveal .mean{font-size:21px;font-weight:600;margin-top:6px}
.reveal .note{color:var(--muted);font-size:15px;margin-top:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.icon-btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px;display:inline-flex;gap:6px;align-items:center;min-height:44px}
.icon-btn.big-play{padding:22px 30px;font-size:20px}
.heard{margin-top:12px;font-size:15px}
.heard .ok{color:var(--pine);font-weight:700}
.heard .meh{color:var(--ochre);font-weight:700}
.heard .no{color:var(--red);font-weight:700}
.study-foot{padding:12px 18px 18px;max-width:560px;width:100%;margin:0 auto}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:0;border-radius:12px;padding:10px 4px;min-height:60px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);border:1.5px solid var(--line)}
.grades button small{font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.grades .g0{color:var(--red)}
.grades .g2{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grades .g2 small{color:var(--paper);opacity:.75}
.hintline{margin-top:14px;min-height:28px}
.linkish{border:0;background:none;color:var(--pine);font-weight:600;padding:6px 0;font-size:15px;text-decoration:underline;text-underline-offset:3px}

/* Lists */
.search{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin:14px 0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -18px;padding-left:18px;padding-right:18px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;width:100%;text-align:left;border:0;background:none}
.item .w{font-size:21px;font-weight:600}
.item .g{grid-column:1;color:var(--muted);font-size:15px}
.item .p{grid-column:1;font-size:15px}
.dot{grid-row:1/span 3;grid-column:2;align-self:center;font-size:12px;color:var(--muted);text-align:right}
.dot.learning{color:var(--ochre)}
.dot.known{color:var(--pine);font-weight:700}

/* Reader */
.texts{list-style:none;padding:0;margin:14px 0}
.texts button{width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;border:1.5px solid var(--line)}
.texts .lvl{font-size:13px;color:var(--muted);white-space:nowrap}
.texts .t{font-weight:700;font-size:19px}
.sent{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.sent .play{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:14px}
.sent .play.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.sent .line{font-size:21px;line-height:1.35;cursor:pointer}
.sent .ph{grid-column:2;font-size:16px}
.sent .tr{grid-column:2;color:var(--pine);font-size:16px}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.res{list-style:none;padding:0;margin:8px 0 0}
.res li{padding:10px 0;border-bottom:1px solid var(--line)}
.res a{font-weight:700}

/* Letters */
.quiz{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;text-align:center}
.quiz .L{font-family:var(--cond);font-size:120px;font-weight:800;line-height:1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.opts button{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 8px;min-height:54px;font-weight:600}
.opts button.right{background:var(--pine);color:#fff;border-color:var(--pine)}
.opts button.wrong{background:var(--red-soft);border-color:var(--red)}
.atable{width:100%;border-collapse:collapse;margin-top:8px}
.atable td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.atable .lt{font-family:var(--cond);font-size:34px;font-weight:800;width:74px;line-height:1}
.atable .ff{color:var(--red);font-size:12px;font-weight:700}
.atable tr{cursor:pointer}

/* Settings */
.set{padding:14px 0;border-bottom:1px solid var(--line)}
.set label{display:block;font-weight:600}
.set select,.set input[type=range]{width:100%;margin-top:8px;font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--pine)}
textarea{width:100%;min-height:90px;font:13px/1.3 ui-monospace,Menlo,monospace;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px;margin-top:8px}
.synctext.bad{color:var(--red)}
.steps{padding-left:20px}.steps li{margin:6px 0}
details summary{cursor:pointer;color:var(--pine);font-weight:600;padding:6px 0}
/* Tests and games */
.choices{display:grid;gap:8px;margin-top:18px}
.choices button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;min-height:54px;text-align:left;font-size:17px;font-weight:600}
.choices.bgc button{font-size:21px;font-weight:400}
.choices button.right,.tile.done{border-color:var(--pine)}
.choices button.right{background:var(--pine);color:#fff}
.choices button.right .phon,.choices button.right .phon b{color:#fff}
.choices button.wrong{background:var(--red-soft);border-color:var(--red)}
.choices button:disabled{cursor:default}
.verdict{margin-top:16px;font-weight:700;font-size:18px}
.verdict.ok{color:var(--pine)} .verdict.no{color:var(--red)}
.answer{min-height:60px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;padding:10px 0;margin:16px 0 14px;align-items:center}
.answer.ok{border-color:var(--pine)} .answer.no{border-color:var(--red)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chipw{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:20px;min-height:46px}
.chipw.used{visibility:hidden}
.gapline{font-size:24px;line-height:1.5;margin-bottom:6px}
.gap{display:inline-block;min-width:4em;border-bottom:3px solid var(--ochre);height:1.1em;vertical-align:-0.1em}
.gapfill{color:var(--pine);font-weight:700;border-bottom:3px solid var(--pine)}
.bytype{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:14px}
.bytype div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;margin:10px 0 8px;padding-bottom:18px}
.hist div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.hist i{display:block;border-radius:4px 4px 0 0;background:var(--line)}
.hist i.hi{background:var(--pine)} .hist i.mid{background:var(--ochre)} .hist i.lo{background:var(--red)}
.hist em{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;color:var(--muted)}
.glist{list-style:none;padding:0;margin:14px 0}
.glist button{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;flex-direction:column;gap:3px}
.glist button:disabled{opacity:.55;cursor:default}
.glist .gt{font-size:20px;font-weight:700}
.glist .gt .bg{font-family:var(--cond);font-size:26px}
.glist .gd{color:var(--muted);font-size:15px}
.glist .gb{color:var(--pine);font-size:14px;font-weight:700}
.hud{display:flex;justify-content:space-between;align-items:center;padding:0 18px 4px;max-width:560px;margin:0 auto;width:100%;font-size:16px}
.hudnum{font-weight:800;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.mult{font-family:var(--cond);font-size:28px;font-weight:800;color:var(--muted)}
.mult.on{color:var(--red)}
.lives{font-size:22px;color:var(--red);letter-spacing:2px}
.gstage{justify-content:flex-start;padding-top:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-height:64px;padding:8px;font-size:16px;font-weight:600}
.tile.bg{font-size:21px;font-weight:400}
.tile.sel{border-color:var(--ochre);box-shadow:0 0 0 2px var(--ochre) inset}
.tile.done{opacity:.25}
.tile.bad{background:var(--red-soft);border-color:var(--red)}
.tfshown{font-size:24px;font-weight:600;margin:18px 0 6px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tfshown.ok{color:var(--pine)} .tfshown.no{color:var(--red)}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.tfbtns button{border:0;border-radius:14px;min-height:70px;font-size:20px;font-weight:700;color:#fff}
.tfbtns .yes{background:var(--pine)} .tfbtns .no{background:var(--red)}
.tfbtns button:disabled{opacity:.5}
.item .w.sentw{font-size:18px}
.tabs button{font-size:12px}
.tabs button .gl{font-size:20px}
.banner{background:var(--red-soft);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs button{flex:1;border:0;background:none;padding:8px 2px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.tabs button .gl{font-family:var(--cond);font-size:22px;font-weight:800;line-height:1}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .gl{color:var(--red)}
.done{text-align:center}
.done .big{margin-bottom:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
"use strict";
/* =====================================================================
   CONTENT — Bulgarian. Format: bulgarian | english | category | note
   Stress: an apostrophe after the stressed vowel (благодаря').
   ^ = the final а/я is pronounced as ъ (благодаря' → blagodaryă).
   Single-vowel words are stressed automatically, except clitics in phrases.
   Order = the order new cards are introduced (most useful first).
   ===================================================================== */
const BG_DECK = `
Здраве'й|hello (to one person, informal)|phrase|To several people, or politely: Здравейте.
Благодаря'^|thank you|phrase|The final я sounds like "yă", not "ya".
Да|yes|phrase|Watch out: many Bulgarians shake the head for yes and nod for no.
Не|no / not|phrase
Мо'ля|please / you're welcome|phrase|Also "pardon?" and what you say when handing something over.
аз|I|pron
ти|you (one person, informal) / to you|pron|Also the short form for "your": майка ти, your mother.
съм|I am|verb|Present of "to be": съм, си, е, сме, сте, са.
е|is (he/she/it is)|verb
и|and|link
До'бър де'н|good afternoon / hello|phrase|The all-purpose daytime greeting.
това'|this / that / it|pron
какво'|what|q
и'мам|I have|verb
ня'ма|there isn't / no (won't)|verb|Also builds the negative future: няма да чета, I won't read.
и'ма|there is / there are|verb
не'|not|link|Goes right before the verb: не знам.
Изви'нете|excuse me / sorry (polite)|phrase|To a friend: Извинявай.
Ка'к си?|how are you? (informal)|phrase
Добре', благодаря'^. А ти'?|fine, thanks. And you?|phrase
той|he|pron
тя|she|pron
ни'е|we|pron
ви'е|you (plural, or polite "you")|pron|Capitalised Вие when used politely to one person.
те|they|pron
на|on / at / of / to|link|Also marks possession: книгата на Мария, Maria's book.
в|in / into / at|link|Becomes във before в- and ф-: във Варна.
с|with|link|Becomes със before с- and з-.
за|for / about|link
от|from / of / since|link
ще|will (future)|link|ще + present: ще чета, I will read.
да|to (verb link) / that|link|There is no infinitive: искам да чета, I want to read.
мо'га|I can|verb
и'скам|I want|verb
зна'я|I know|verb|Short form знам is just as common.
Не зна'м.|I don't know|phrase
Не разби'рам.|I don't understand|phrase
Гово'рите ли англи'йски?|do you speak English?|phrase
ли|question particle|link|Goes after the word in question: Готов ли си? Are you ready?
къде'|where|q
кога'|when|q
защо'|why|q
как|how|q
ко'лко|how much / how many|q
кой|who (m) / which|q
Ка'к се ка'зваш?|what's your name? (informal)|phrase

const isCyr = ch => /[\u0400-\u04FF'^]/.test(ch);

function analyze(raw){
  const toks=[]; let cur="", w=null;
  for(const ch of raw){ const c=isCyr(ch); if(w===null) w=c; if(c!==w){toks.push({w,t:cur}); cur=""; w=c;} cur+=ch; }
  if(cur) toks.push({w,t:cur});
  const words=toks.filter(t=>t.w);
  const multi=words.length>1;
  toks.forEach((t,ti)=>{
    if(!t.w) return;
    t.ti=ti; const letters=[]; let st=-1, flag=false;
    for(const ch of t.t){ if(ch==="'") st=letters.length-1; else if(ch==="^") flag=true; else letters.push(ch); }
    t.letters=letters; t.flag=flag; t.low=letters.join("").toLowerCase();
    const vi=[]; [...t.low].forEach((c,i)=>{ if(VOW.includes(c)) vi.push(i); });
    t.nv=vi.length; t.lastV=vi.length?vi[vi.length-1]:-1; t.unstressed=false;
    if(st<0 && vi.length===1){
      const nx=toks[ti+1]; const hyph = nx && nx.t.startsWith("-") && (t.low==="по"||t.low==="най");
      if(multi && CLITICS.has(t.low) && !hyph) t.unstressed=true; else st=vi[0];
    }
    if(st<0 && vi.length===0 && multi) t.unstressed=true;
    t.st=st; t.known = st>=0 || t.unstressed;
  });
  return {toks,words,single:words.length===1};
}

function plain(raw){return raw.replace(/['^]/g,"");}
function cyrHTML(a){

      let g; try{ g=await gh("GET",filePath()); }catch(e){ throw "network"; }

      if(g.status===200){ sha=g.data.sha; try{ remote=JSON.parse(b64dec(g.data.content)); }catch(e){ remote=null; } }

        content:b64enc(JSON.stringify({app:"govorya",lang:"bg",v:1,savedAt:Date.now(),resetAt:S.resetAt||0,cards:S.cards,log:S.log,intro:S.intro,tests:S.tests,games:S.games}))};

const MIN=6e4, DAY=864e5;

function schedule(c0,grade,now){
  const c = c0 && c0.e!=null ? {...c0} : {e:2.5,i:0,r:0,l:0,s:0,d:now};
  c.t=now;
  if(grade===0){ if(c.r>0) c.l++; c.r=0; c.i=0; c.s=0; c.e=Math.max(1.3,c.e-0.2); c.d=now+MIN; }
  else if(grade===1){ if(c.i===0) c.d=now+5*MIN; else { c.i=Math.max(1,c.i*1.2); c.d=now+c.i*DAY; } c.e=Math.max(1.3,c.e-0.15); }
  else if(grade===2){
    if(c.i===0){ if(c.s===0){ c.s=1; c.d=now+10*MIN; } else { c.i=1; c.r++; c.d=now+DAY; } }
    else { c.i=c.i*c.e; c.r++; c.d=now+c.i*DAY; }
  } else { c.i = c.i===0 ? 4 : c.i*c.e*1.3; c.e+=0.15; c.r++; c.d=now+c.i*DAY; }

}

let view="today", session=null, reader=null, wordFilter="all", wordQuery="", quiz=null;
const TABS=[["today","Днес","Today"],["words","Думи","Words"],["games","Игри","Games"],["read","Чети","Read"],["letters","Букви","Letters"],["more","Още","More"]];
let test=null, game=null;
const busy=()=>!!(session||test||game);
function applyTheme(){
  const th=S.settings.theme;
  if(th) document.documentElement.setAttribute("data-theme",th); else document.documentElement.removeAttribute("data-theme");
  /* Status bar colour: follow the phone, unless Appearance is forced to light or dark. */
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{
    const own = m.media.includes("dark") ? "#14181C" : "#F2F3F1";
    m.content = th==="dark" ? "#14181C" : th==="light" ? "#F2F3F1" : own;
  });
}

function renderTabs(){
  tabs.style.display = busy() ? "none" : "flex";
  tabs.innerHTML = TABS.map(([k,g,l])=>`<button data-tab="${k}" ${view===k?'aria-current="page"':''}><span class="gl" lang="bg">${g}</span>${l}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{ view=b.dataset.tab; reader=null; render(); window.scrollTo(0,0); });
}
function render(){
  applyTheme(); renderTabs();
  if(session) return renderStudy();
  if(test) return renderTest();
  if(game) return renderGame();
  ({today:renderToday, words:renderWords, games:renderGames, read:renderRead, letters:renderLetters, more:renderMore})[view]();
}

/* ---------- Study session ---------- */
function startSession(){
  const due=dueList(), nw=newList(); const q=[];
  let di=0, ni=0;
  while(di<due.length||ni<nw.length){ for(let k=0;k<3&&di<due.length;k++) q.push(due[di++]); if(ni<nw.length) q.push(nw[ni++]); }
  session={queue:q, total:q.length, done:0, cur:null, revealed:false, heard:null, mode:null, hint:false, again:0};
  nextCard();
}
function nextCard(){
  const s=session; s.revealed=false; s.heard=null; s.hint=false; s.rec=null; stopRecording();
  if(!s.queue.length){ s.cur=null; render(); if(syncOn()) sync(); return; }
  s.cur=s.queue[0];
  const [type]=s.cur.split(":").slice(-1);
  const c=S.cards[s.cur];
  s.mode = type==="s" ? "speak" : (hasVoice() && c && c.r>0 && Math.random()<S.settings.audioFirst) ? "listen" : "read";
  render();
  if(s.mode==="listen") setTimeout(()=>speak(R(BY_ID[itemOf(s.cur)].bg).text),250);
}
const itemOf = cid => cid.slice(0,cid.lastIndexOf(":"));
function grade(g){
  const s=session, cid=s.cur, now=Date.now(); const prev=S.cards[cid];
  const isNew=!prev;
  const c=schedule(prev,g,now); S.cards[cid]=c;
  if(isNew && cid.endsWith(":r")){ c.f=today(); S.intro[today()]=(S.intro[today()]||0)+1; }
  if(cid.endsWith(":r") && g>=2 && !S.cards[itemOf(cid)+":s"]) S.cards[itemOf(cid)+":s"]={e:2.5,i:0,r:0,l:0,s:0,d:now+DAY,t:now};
  S.log[today()]=(S.log[today()]||0)+1;
  save();
  s.queue.shift();
  if(c.d < now+20*MIN){ const pos=Math.min(s.queue.length, 3+Math.floor(Math.random()*3)); s.queue.splice(pos,0,cid); if(g===0) s.again++; }
  else s.done++;
  if(s.done>s.total) s.total=s.done;
  nextCard();
}
function renderStudy(){
  const s=session;
  if(!s.cur){
    app.innerHTML=`<div class="study"><div class="stage done">
      <div class="big s2 bg" lang="bg">${R("Бра'во!").cyr}</div>${HW("Браво!","card s2")}
      <p class="muted">${s.done} card${s.done===1?"":"s"} done. ${streak()>1?`That's ${streak()} days in a row.`:"See you tomorrow."}</p>
      <div class="row" style="justify-content:center;margin-top:18px"><button class="btn" id="fin">Back to today</button></div>
    </div></div>`;
    document.getElementById("fin").onclick=()=>{ session=null; view="today"; render(); };
    return;
  }
  const it=BY_ID[itemOf(s.cur)], r=R(it.bg), c=S.cards[s.cur];
  const len=r.text.length, size = len<=8?"s1":len<=16?"s2":"s3";
  const pct = Math.round(100*s.done/Math.max(1,s.total));
  const kindTxt = {read:"Read it — what does it mean?", listen:"Listen — what did you hear?", speak:"Say it in Bulgarian, out loud"}[s.mode] + (c?"":" (new)");
  let prompt="";
  if(s.mode==="read") prompt=`<div class="big ${size} bg" lang="bg">${r.cyr}</div>${HW(it.bg,"card "+size)}
     <div class="hintline">${s.revealed?"":(S.settings.phonFirst||s.hint)?`<span class="phon" style="font-size:22px">${r.phon}</span>`:`<button class="linkish" id="hint">Show pronunciation</button>`}</div>`;
  if(s.mode==="listen") prompt= s.revealed ? `<div class="big ${size} bg" lang="bg">${r.cyr}</div>${HW(it.bg,"card "+size)}` : `<div><button class="icon-btn big-play" id="replay">▶ Play again</button></div><div class="hintline"><button class="linkish" id="slow">Play slowly</button></div>`;
  if(s.mode==="speak") prompt= `<div class="en-big">${esc(it.en)}</div>` + (s.revealed?`<div class="big ${size} bg" lang="bg" style="margin-top:16px">${r.cyr}</div>${HW(it.bg,"card "+size)}`:"");
  const reveal = s.revealed ? `<div class="reveal">
      ${s.mode!=="read"||!(S.settings.phonFirst||s.hint)?`<div class="phon">${r.phon}</div>`:`<div class="phon">${r.phon}</div>`}
      ${s.mode!=="speak"?`<div class="mean">${esc(it.en)}</div>`:""}
      ${it.note?`<div class="note">${esc(it.note)}</div>`:""}
      <div class="row" style="margin-top:14px">
        ${hasVoice()?`<button class="icon-btn" id="play">▶ Listen</button><button class="icon-btn" id="slow2">Slowly</button>`:""}
        ${CAN_REC?`<button class="icon-btn" id="rec">${s.rec==="on"?"■ Stop recording":"● Record myself"}</button>`:""}
        ${s.rec==="done"?`<button class="icon-btn" id="mine">▶ Mine</button>${hasVoice()?`<button class="icon-btn" id="both">▶ Mine, then the voice</button>`:""}`:""}
        ${SR && !(IOS&&STANDALONE)?`<button class="icon-btn" id="mic">Check with speech recognition</button>`:""}
      </div>
      ${s.heard?`<div class="heard">${s.heard.err?`<span class="no">${esc(s.heard.err)}</span>`:`Heard: <span lang="bg">“${esc(s.heard.heard)}”</span> — <span class="${s.heard.score>.85?"ok":s.heard.score>.6?"meh":"no"}">${s.heard.score>.85?"spot on":s.heard.score>.6?"close":"not quite"}</span>`}</div>`:""}
    </div>` : "";
  const now=Date.now();
  const foot = s.revealed
    ? `<div class="grades">${["Again","Hard","Good","Easy"].map((l,g)=>`<button class="g${g}" data-g="${g}">${l}<small>${fmtIvl(schedule(c,g,now).d-now)}</small></button>`).join("")}</div>`
    : `<button class="btn wide" id="show">${s.mode==="speak"?"I've said it — show me":"Show answer"}</button>
       ${s.mode==="speak"&&CAN_REC?`<button class="btn wide ghost" id="rec0" style="margin-top:8px">${s.rec==="on"?"■ Stop — show me how it should sound":"● Record myself saying it"}</button>`:""}
       ${s.mode==="speak"&&SR&&!(IOS&&STANDALONE)?`<button class="btn wide ghost" id="mic0" style="margin-top:8px">Say it and check with speech recognition</button>`:""}`;
  app.innerHTML=`<div class="study">
    <div class="study-top"><button class="x" id="quit" aria-label="End session">✕ End</button><div class="bar"><i style="width:${pct}%"></i></div><span class="muted small">${s.queue.length} left</span></div>
    <div class="stage"><div class="kind">${kindTxt}</div>${prompt}${reveal}</div>
    <div class="study-foot">${foot}</div>
  </div>`;
  const $=id=>document.getElementById(id);
  $("quit").onclick=()=>{ stopRecording(); speechSynthesis&&speechSynthesis.cancel(); session=null; render(); };
  if($("hint")) $("hint").onclick=()=>{ s.hint=true; render(); };
  if($("replay")) $("replay").onclick=()=>speak(r.text);
  if($("slow")) $("slow").onclick=()=>speak(r.text,0.6);
  if($("play")) $("play").onclick=()=>speak(r.text);
  if($("slow2")) $("slow2").onclick=()=>speak(r.text,0.6);
  const doMic=(revealAfter)=>{ const b=$("mic")||$("mic0"); if(b){ b.textContent="Listening…"; b.disabled=true; } listen(r.text,res=>{ s.heard=res; if(revealAfter){ s.revealed=true; } render(); }); };
  if($("mic")) $("mic").onclick=()=>doMic(false);
  const toggleRec=(revealAfter)=>{
    if(s.rec==="on"){ stopRecording(); return; }
    if("speechSynthesis" in window) speechSynthesis.cancel();
    startRecording(()=>{ s.rec="done"; if(revealAfter) s.revealed=true; render(); playMine(r.text); },
                   err=>{ s.rec=null; s.heard={err}; if(revealAfter) s.revealed=true; render(); })
      .then(ok=>{ if(ok){ s.rec="on"; render(); } });
  };
  if($("rec")) $("rec").onclick=()=>toggleRec(false);
  if($("rec0")) $("rec0").onclick=()=>toggleRec(true);
  if($("mine")) $("mine").onclick=()=>playMine(null);
  if($("both")) $("both").onclick=()=>playMine(r.text);
  if($("mic0")) $("mic0").onclick=()=>doMic(true);
  if($("show")) $("show").onclick=()=>{ s.revealed=true; render(); if(hasVoice()&&s.mode!=="listen") speak(r.text); };
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
}

  const q=wordQuery.toLowerCase();
  const list=ITEMS.filter(i=>(wordFilter==="all"||i.cat===wordFilter) && (!q || plain(i.bg).toLowerCase().includes(q) || i.en.toLowerCase().includes(q) || R(i.bg).phon.replace(/<\/?b>/g,"").includes(q)));
  app.innerHTML=`<div class="wrap">
    <h2>Words and sentences</h2>
    <p class="muted small">${WORD_COUNT} of the most used words and phrases, plus ${SENT_COUNT} sentences, in the order you'll learn them. Tap one to hear it.</p>
    <input class="search" id="q" type="search" placeholder="Search Bulgarian, English or sound" value="${esc(wordQuery)}" aria-label="Search">
    <div class="chips">${[["all","All"],...Object.entries(CAT)].map(([k,l])=>`<button class="chip ${wordFilter===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>
    <ul class="list">${list.slice(0,wordLimit).map(i=>{ const r=R(i.bg), st=status(i.id); return `<li><button class="item" data-id="${esc(i.id)}"><span class="w bg ${i.cat==="sent"?"sentw":""}" lang="bg">${r.cyr}</span><span class="dot ${st}">${st==="new"?"":st==="known"?"known":"learning"}</span>${S.settings.showHand?`<span class="hw" lang="bg">${esc(r.text)}</span>`:""}<span class="p phon">${r.phon}</span><span class="g">${esc(i.en)}</span></button></li>`;}).join("")}</ul>
    ${list.length>wordLimit?`<button class="btn ghost wide" id="more" style="margin-top:14px">Show more (${list.length-wordLimit} left)</button>`:""}
    ${!list.length?`<p class="muted">Nothing matches “${esc(wordQuery)}”.</p>`:""}
  </div>`;
  const inp=document.getElementById("q");
  const mb=document.getElementById("more"); if(mb) mb.onclick=()=>{ wordLimit+=300; renderWords(); };
  inp.oninput=()=>{ wordQuery=inp.value; wordLimit=120; const p=inp.selectionStart; renderWords(); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(p,p); };
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ wordFilter=b.dataset.f; wordLimit=120; renderWords(); });
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>speak(R(BY_ID[b.dataset.id].bg).text));
}

  $("tr").onclick=()=>{ reader.tr=!reader.tr; renderReader(); };
  app.querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>{ const i=+el.dataset.s; reader.open[i]=!reader.open[i]; renderReader(); });
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.p; reader.playing=i; renderReader(); speak(R(t.s[i][0]).text,null,()=>{ if(reader&&reader.playing===i){ reader.playing=-1; renderReader(); } }); });

  };
}

/* ---------- Letters ---------- */
function newQuiz(){
  const pool=L.letters; const a=pool[Math.floor(Math.random()*pool.length)];
  const opts=[a]; while(opts.length<4){ const b=pool[Math.floor(Math.random()*pool.length)]; if(!opts.includes(b)) opts.push(b); }
  opts.sort(()=>Math.random()-.5);
  quiz={...(quiz||{score:0,n:0}), a, opts, picked:null};
}
function renderLetters(){
  if(!quiz||!quiz.a) newQuiz();
  const q=quiz;
  app.innerHTML=`<div class="wrap">
    <h2>The alphabet</h2>
    <p class="muted small">30 letters. Six of them look like Latin letters but aren't — they're marked in red below.</p>
    <div class="quiz">
      <div class="muted small">Which sound? ${q.n?`${q.score} of ${q.n} right`:""}</div>
      <div class="L" lang="bg">${q.a[0]}<span style="font-size:.6em;margin-left:.1em">${q.a[0].toLowerCase()}</span></div>
      ${S.settings.showHand?`<div class="hw" style="font-size:56px">${q.a[0]} ${q.a[0].toLowerCase()}</div>`:""}
      <div class="opts">${q.opts.map((o,i)=>`<button data-o="${i}" class="${q.picked!==null?(o===q.a?"right":(q.picked===i?"wrong":"")):""}" ${q.picked!==null?"disabled":""}>${esc(o[1])}</button>`).join("")}</div>
      ${q.picked!==null?`<p style="margin-top:14px"><span lang="bg" style="font-size:22px">${R(q.a[3]).cyr}</span>${S.settings.showHand?` <span class="hw" style="font-size:22px">${esc(plain(q.a[3]))}</span>`:""} <span class="phon">${R(q.a[3]).phon}</span> — ${esc(q.a[4])}<br><span class="muted small">${esc(q.a[2])}</span></p><button class="btn" id="nextq" style="margin-top:6px">Next letter</button>`:""}
    </div>
    <table class="atable"><tbody>${L.letters.map((l,i)=>{ const r=R(l[3]); return `<tr data-l="${i}"><td class="lt" lang="bg">${l[0]}${l[0].toLowerCase()}${S.settings.showHand?`<div class="hwl">${l[0]}${l[0].toLowerCase()}</div>`:""}</td><td><strong>${esc(l[1])}</strong> ${l[5]?'<span class="ff">false friend</span>':''}<br><span class="muted small">${esc(l[2])}</span></td><td><span lang="bg">${r.cyr}</span>${S.settings.showHand?`<br><span class="hw" style="font-size:18px">${esc(r.text)}</span>`:""}<br><span class="phon small">${r.phon}</span></td></tr>`;}).join("")}</tbody></table>
    <p class="muted small" style="margin-top:12px">Tap a row to hear the example. Each letter is shown printed (black) and handwritten (green). Handwriting differs most for д, т, и, к and л — learn to recognise both.</p>
  </div>`;
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.o; q.picked=i; q.n++; if(q.opts[i]===q.a) q.score++; renderLetters(); speak(R(q.a[3]).text); });
  const nx=document.getElementById("nextq"); if(nx) nx.onclick=()=>{ newQuiz(); renderLetters(); };
  app.querySelectorAll("[data-l]").forEach(tr=>tr.onclick=()=>speak(R(L.letters[+tr.dataset.l][3]).text));
}

    <h2 style="margin-top:30px">How it works</h2>
    <p>Each word gets two cards. First you <strong>read</strong> it (or hear it) and recall the meaning. The next day a <strong>speaking</strong> card appears: you see the English and say the Bulgarian out loud. No typing — this app trains reading, listening and speaking.</p>
    <p>Rate yourself honestly. <em>Again</em> brings the card back in a minute; <em>Good</em> pushes it further each time you remember it (1 day, then about 3, 7, 18…). The words are ordered by how often they're used, so the first 100 already cover a large share of everyday speech.</p>
    <p>Sentences join your lessons as you go: the first ones unlock after 20 words, and every few hundred words brings longer, more natural ones. About one new card in three is a sentence once they're unlocked.</p>

    <p><strong>Games</strong> only use words and sentences you've already met, so they get richer the further you go.</p>

  const $=id=>document.getElementById(id);

  $("imp").onclick=()=>{ try{ const o=JSON.parse($("bk").value); if(!o.cards) throw 0; S=shape(o); save(); $("imp").textContent="Restored"; setTimeout(render,600); }catch(e){ $("imp").textContent="That isn't a valid backup"; } };
  const restore=txt=>{ const o=JSON.parse(txt); if(!o.cards) throw 0; S=shape(o); save(); };
  $("dl").onclick=()=>{ const b=new Blob([JSON.stringify(S)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="govorya-backup-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
  $("up").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ restore(await f.text()); alert("Progress restored."); render(); }catch(err){ alert("That file isn't a valid backup."); } };
  if($("syncnow")) $("syncnow").onclick=()=>sync();
  if($("unsync")) $("unsync").onclick=()=>{ if(confirm("Stop syncing on this device? Your progress stays here and on GitHub.")){ SY={owner:SY.owner,repo:SY.repo}; saveSY(); renderMore(); } };
  if($("savetok")) $("savetok").onclick=()=>{ const v=$("tok2").value.trim(); if(!v) return; SY.token=v; saveSY(); sync(); renderMore(); };
  if($("connect")) $("connect").onclick=async()=>{
    const msg=$("cmsg"), btn=$("connect");
    const cand={owner:$("own").value.trim(), repo:$("rep").value.trim(), token:$("tok").value.trim()};
    if(!cand.owner||!cand.repo||!cand.token){ msg.textContent="Fill in all three fields."; return; }
    btn.disabled=true; msg.textContent="Checking…";
    const prev=SY; SY={...cand};
    let r; try{ r=await gh("GET",repoPath()); }catch(e){ SY=prev; btn.disabled=false; msg.textContent=syncErr("network"); return; }
    if(r.status!==200){ SY=prev; btn.disabled=false; msg.textContent=syncErr(r.status); return; }
    if(r.data && r.data.private===false){ SY=prev; btn.disabled=false; msg.textContent="That repository is public, so anyone could read your progress. Make it private (Settings → General → Change visibility) and try again."; return; }
    saveSY(); await sync(); renderMore();

/* =====================================================================
   SHARED HELPERS FOR TESTS AND GAMES
   ===================================================================== */
const shuffle=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick=a=>a[Math.floor(Math.random()*a.length)];
const startedItems=()=>ITEMS.filter(i=>S.cards[i.id+":r"]);
const startedWordItems=()=>startedItems().filter(i=>i.cat!=="sent");
const startedSentItems=()=>startedItems().filter(i=>i.cat==="sent" && sentWords(i.bg).length>=3);
const gloss1=en=>en.toLowerCase().replace(/\(.*?\)/g,"").split(/[\/,;]/)[0].replace(/^(i|to|a|an|the)\s+/,"").trim();
function distractors(item,n,prefer){
  const g=gloss1(item.en), t=keyOf(item.bg), isS=item.cat==="sent";
  const ok=x=>x.id!==item.id && gloss1(x.en)!==g && keyOf(x.bg)!==t && x.en!==item.en && (x.cat==="sent")===isS;
  const same=x=>isS || x.cat===item.cat;
  const tiers=[(prefer||[]).filter(x=>ok(x)&&same(x)), ITEMS.filter(x=>ok(x)&&same(x)), ITEMS.filter(ok)];
  const out=[]; for(const tier of tiers){ for(const x of shuffle(tier)){ if(out.length>=n) break; if(!out.includes(x) && !out.some(o=>gloss1(o.en)===gloss1(x.en))) out.push(x); } if(out.length>=n) break; }
  return out;
}
function lookalikes(item,n,pool){
  const t=keyOf(item.bg);
  const sc=x=>{ const k=keyOf(x.bg); return Math.abs(k.length-t.length)+(k[0]===t[0]?0:2)+Math.random()*2.5; };
  return (pool.length>=n+1?pool:ITEMS).filter(x=>x.id!==item.id && keyOf(x.bg)!==t && (x.cat==="sent")===(item.cat==="sent")).map(x=>[sc(x),x]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1]);
}
const chipText=(w,k)=> k===0 && !NAMES.has(w) ? w.toLowerCase() : w;
function gapHTML(raw,k,fill){
  let i=-1;
  return esc(plain(raw)).replace(/[\u0400-\u04FF0-9]+(?:-[\u0400-\u04FF0-9]+)*/g,m=>{ i++; return i===k ? (fill?`<span class="gapfill">${esc(fill)}</span>`:`<span class="gap">&nbsp;</span>`) : m; });
}
function makeGap(it){
  const words=sentWords(it.bg);
  const cand=words.map((w,k)=>({w,k})).filter(x=>x.w.replace(/-/g,"").length>=3 && !NAMES.has(x.w));
  const g=cand.length ? pick(cand.sort((a,b)=>b.w.length-a.w.length).slice(0,3)) : {w:words[words.length-1],k:words.length-1};
  const target=g.w.toLowerCase(), bank=new Set();
  for(const s of shuffle(ITEMS.filter(x=>x.cat==="sent"))){ for(const w of sentWords(s.bg)){ const lw=w.toLowerCase(); if(lw!==target && !NAMES.has(w) && Math.abs(lw.length-target.length)<=2) bank.add(lw); } if(bank.size>40) break; }
  return {gapK:g.k, gapWord:target, gapOpts:shuffle([target,...shuffle([...bank]).slice(0,3)])};
}
let actx=null;
function beep(ok){
  if(!S.settings.sounds) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type=ok?"triangle":"sine"; o.frequency.setValueAtTime(ok?660:200,t); if(ok) o.frequency.setValueAtTime(990,t+0.07);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+(ok?0.2:0.28));
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.3);
  }catch(e){}
}
const sizeFor=txt=>txt.length<=8?"s1":txt.length<=16?"s2":"s3";
function topBar(label,pct,right){ return `<div class="study-top"><button class="x" id="quit">✕ ${label}</button><div class="bar"><i style="width:${pct}%"></i></div><span class="muted small">${right}</span></div>`; }

/* =====================================================================
   TEST MODE — 12 mixed questions on what you've started, weakest first
   ===================================================================== */
const TEST_LEN=12;
const TYPE_LABEL={meaning:"Meaning",reverse:"English → Bulgarian",listen:"Listening",say:"Speaking",build:"Word order",gap:"Missing word"};
function startTest(){
  const pool=startedItems(); if(pool.length<8) return;
  const ranked=pool.map(i=>{ const c=S.cards[i.id+":r"]; return {i, w:(c.l||0)*1.5 + 2/(1+c.i) + Math.random()*1.4}; }).sort((a,b)=>b.w-a.w).map(x=>x.i);
  const sents=ranked.filter(i=>i.cat==="sent"), words=ranked.filter(i=>i.cat!=="sent");
  const nS=Math.min(sents.length, sents.length>=3?4:0);
  const chosen=shuffle([...sents.slice(0,nS), ...words.slice(0,TEST_LEN-nS)]).slice(0,TEST_LEN);
  test={qs:chosen.map(makeQ), idx:0, ok:0, saved:false};
  render();
}
function makeQ(it){
  let types;
  if(it.cat==="sent") types = sentWords(it.bg).length>=3 ? ["build","build","gap","gap","meaning","say"] : ["meaning","say"];
  else { types=["meaning","meaning","reverse","reverse","say"]; if(hasVoice()) types.push("listen","listen"); }
  const q={it, type:pick(types), answered:false};
  if(q.type==="meaning") q.opts=shuffle([it,...distractors(it,3,startedItems())]);
  if(q.type==="reverse") q.opts=shuffle([it,...distractors(it,3,startedItems())]);
  if(q.type==="listen") q.opts=shuffle([it,...lookalikes(it,3,startedWordItems())]);
  if(q.type==="build"){ q.words=sentWords(it.bg); q.chips=shuffle(q.words.map((w,k)=>({w:chipText(w,k),k}))); q.ans=[]; }
  if(q.type==="gap") Object.assign(q,makeGap(it));
  return q;
}
function testAnswer(correct){
  const t=test, q=t.qs[t.idx]; if(q.answered) return;
  q.answered=true; q.correct=correct; if(correct) t.ok++;
  beep(correct);
  if(hasVoice()) speak(R(q.it.bg).text);
  render();
}
function finishTest(){
  const t=test; if(t.saved) return; t.saved=true;
  const by={}; t.qs.forEach(q=>{ by[q.type]=by[q.type]||[0,0]; by[q.type][1]++; if(q.correct) by[q.type][0]++; });
  const now=Date.now();
  t.qs.filter(q=>!q.correct).forEach(q=>{ const c=S.cards[q.it.id+":r"]; if(c && c.d>now){ S.cards[q.it.id+":r"]={...c,d:now,t:now}; } });
  S.tests.push({id:now.toString(36)+Math.random().toString(36).slice(2,6), at:now, n:t.qs.length, ok:t.ok, by});
  S.tests=S.tests.slice(-100);
  save();
}
function renderTest(){
  const t=test;
  if(t.idx>=t.qs.length) return renderTestResults();
  const q=t.qs[t.idx], it=q.it, r=R(it.bg), A=q.answered;
  const size=sizeFor(r.text);
  const optCls=(isRight,k)=> A ? (isRight?"right":(q.pick===k?"wrong":"")) : "";
  let body="", foot="";
  if(q.type==="meaning"){
    body=`<div class="kind">What does this mean?</div><div class="big ${size} bg" lang="bg">${r.cyr}</div>${HW(it.bg,"card "+size)}
      ${A?`<div class="phon" style="margin-top:8px;font-size:20px">${r.phon}</div>`:""}
      <div class="choices">${q.opts.map((o,k)=>`<button data-o="${k}" class="${optCls(o===it,k)}" ${A?"disabled":""}>${esc(o.en)}</button>`).join("")}</div>`;
  }
  if(q.type==="reverse"||q.type==="listen"){
    body = q.type==="reverse"
      ? `<div class="kind">Which is the Bulgarian for…</div><div class="en-big">${esc(it.en)}</div>`
      : `<div class="kind">Listen. Which one did you hear?</div><div class="row"><button class="icon-btn big-play" id="replay">▶ Play</button><button class="linkish" id="slow">Slowly</button></div>`;
    body+=`<div class="choices bgc">${q.opts.map((o,k)=>`<button data-o="${k}" class="${optCls(o===it,k)}" ${A?"disabled":""} lang="bg">${R(o.bg).cyr}${A&&o===it?`<span class="phon small" style="display:block">${R(o.bg).phon}</span>`:""}</button>`).join("")}</div>`;
    if(A && q.type==="listen") body+=`<p class="mean" style="margin-top:10px">${esc(it.en)}</p>`;
  }
  if(q.type==="say"){
    body=`<div class="kind">Say it in Bulgarian, out loud</div><div class="en-big">${esc(it.en)}</div>`;
    if(q.revealed) body+=`<div class="big ${size} bg" lang="bg" style="margin-top:16px">${r.cyr}</div>${HW(it.bg,"card "+size)}<div class="phon" style="font-size:20px;margin-top:6px">${r.phon}</div>
      <div class="row" style="margin-top:12px">${hasVoice()?`<button class="icon-btn" id="play">▶ Listen</button>`:""}${q.rec==="done"?`<button class="icon-btn" id="mine">▶ Mine</button>`:""}</div>`;
  }
  if(q.type==="build"){
    body=`<div class="kind">Put the words in order</div><div class="en-big" style="font-size:22px">${esc(it.en)}</div>
      <div class="answer ${A?(q.correct?"ok":"no"):""}" lang="bg">${q.ans.map((ci,k)=>`<button class="chipw" data-a="${k}" ${A?"disabled":""}>${esc(q.chips[ci].w)}</button>`).join("")||`<span class="muted small">Tap the words below</span>`}</div>
      <div class="bank" lang="bg">${q.chips.map((c,ci)=>`<button class="chipw ${q.ans.includes(ci)?"used":""}" data-c="${ci}" ${A||q.ans.includes(ci)?"disabled":""}>${esc(c.w)}</button>`).join("")}</div>
      ${A&&!q.correct?`<p style="margin-top:12px">Correct order: <span lang="bg" style="font-size:20px">${r.cyr}</span></p>`:""}
      ${A?`<div class="phon" style="margin-top:6px">${r.phon}</div>`:""}`;
  }
  if(q.type==="gap"){
    body=`<div class="kind">Which word is missing?</div><div class="gapline" lang="bg">${gapHTML(it.bg,q.gapK,A?q.gapWord:null)}</div><p class="muted">${esc(it.en)}</p>
      <div class="choices bgc">${q.gapOpts.map((o,k)=>`<button data-g="${k}" class="${optCls(o===q.gapWord,k)}" ${A?"disabled":""} lang="bg">${esc(o)}</button>`).join("")}</div>`;
  }
  if(A) body+=`<div class="verdict ${q.correct?"ok":"no"}">${q.correct?pick(["Correct!","Right!","Exactly.","Браво!"]):"Not quite — it's back in your reviews."}</div>`;
  if(A) foot=`<button class="btn wide" id="next">${t.idx===t.qs.length-1?"See results":"Continue"}</button>`;
  else if(q.type==="say"){
    foot = !q.revealed
      ? `<button class="btn wide" id="reveal">I've said it — show me</button>${CAN_REC?`<button class="btn wide ghost" id="rec0" style="margin-top:8px">${q.rec==="on"?"■ Stop — show me":"● Record myself saying it"}</button>`:""}`
      : `<div class="grades" style="grid-template-columns:1fr 1fr"><button class="g0" id="saidno">I didn't get it</button><button class="g2" id="saidyes">I got it right</button></div>`;
  }
  else if(q.type==="build") foot=`<button class="btn wide" id="check" ${q.ans.length===q.chips.length?"":"disabled"}>Check</button>`;
  app.innerHTML=`<div class="study">${topBar("End test",Math.round(100*t.idx/t.qs.length),`${t.idx+1} of ${t.qs.length}`)}
    <div class="stage gstage">${body}</div><div class="study-foot">${foot}</div></div>`;
  const $=id=>document.getElementById(id);
  $("quit").onclick=()=>{ stopRecording(); if(t.idx>3 && confirm("Save the questions answered so far?")){ t.qs=t.qs.slice(0,t.idx); finishTest(); } test=null; render(); };
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ q.pick=+b.dataset.o; testAnswer(q.opts[q.pick]===it); });
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ q.pick=+b.dataset.g; testAnswer(q.gapOpts[q.pick]===q.gapWord); });
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ q.ans.push(+b.dataset.c); render(); });
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ q.ans.splice(+b.dataset.a,1); render(); });
  if($("check")) $("check").onclick=()=>testAnswer(q.ans.map(ci=>q.chips[ci].w.toLowerCase()).join(" ")===q.words.map(w=>w.toLowerCase()).join(" "));
  if($("replay")) $("replay").onclick=()=>speak(r.text);
  if($("slow")) $("slow").onclick=()=>speak(r.text,0.6);
  if($("play")) $("play").onclick=()=>speak(r.text);
  if($("mine")) $("mine").onclick=()=>playMine(null);
  if($("reveal")) $("reveal").onclick=()=>{ q.revealed=true; render(); if(hasVoice()) speak(r.text); };
  if($("rec0")) $("rec0").onclick=()=>{
    if(q.rec==="on"){ stopRecording(); return; }
    startRecording(()=>{ q.rec="done"; q.revealed=true; render(); playMine(r.text); }, err=>{ q.rec=null; q.revealed=true; render(); alert(err); })
      .then(ok=>{ if(ok){ q.rec="on"; render(); } });
  };
  if($("saidyes")) $("saidyes").onclick=()=>testAnswer(true);
  if($("saidno")) $("saidno").onclick=()=>testAnswer(false);
  if($("next")) $("next").onclick=()=>{ t.idx++; if(t.idx>=t.qs.length) finishTest(); render(); };
  if(q.type==="listen" && !A && !q.played){ q.played=true; setTimeout(()=>speak(r.text),250); }
}
function historyBars(list){
  if(!list.length) return "";
  return `<div class="hist" aria-label="Recent test scores">${list.map(x=>{ const p=Math.round(100*x.ok/x.n); return `<div title="${new Date(x.at).toLocaleDateString()}: ${p}%"><i style="height:${Math.max(6,p)}%" class="${p>=80?"hi":p>=50?"mid":"lo"}"></i><em>${p}</em></div>`; }).join("")}</div>`;
}
function renderTestResults(){
  const t=test, n=t.qs.length, pct=n?Math.round(100*t.ok/n):0;
  const msg = pct>=90?"Excellent. These words are sticking.": pct>=70?"Solid. The misses are back in your reviews.": pct>=50?"Getting there. Review the misses today.":"Tough one. Slow down on new words and review more.";
  const by={}; t.qs.forEach(q=>{ by[q.type]=by[q.type]||[0,0]; by[q.type][1]++; if(q.correct) by[q.type][0]++; });
  const misses=t.qs.filter(q=>!q.correct);
  app.innerHTML=`<div class="study"><div class="stage" style="justify-content:flex-start;padding-top:30px">
    <div class="big s1">${t.ok}<span class="muted" style="font-size:.45em"> / ${n}</span></div>
    <p style="font-size:19px;margin-top:6px"><strong>${pct}%</strong> — ${msg}</p>
    <div class="bytype">${Object.entries(by).map(([k,[a,b]])=>`<div><span>${TYPE_LABEL[k]}</span><strong>${a}/${b}</strong></div>`).join("")}</div>
    ${misses.length?`<h3 style="margin-top:20px">To review</h3><ul class="list">${misses.map(q=>`<li><button class="item" data-id="${esc(q.it.id)}"><span class="w bg ${q.it.cat==="sent"?"sentw":""}" lang="bg">${R(q.it.bg).cyr}</span><span class="p phon">${R(q.it.bg).phon}</span><span class="g">${esc(q.it.en)}</span></button></li>`).join("")}</ul>`:""}
    <h3 style="margin-top:22px">Your last tests</h3>${historyBars(S.tests.slice(-12))}
    <p class="muted small">${level()} — ${startedWordCount()} words started, ${ITEMS.filter(i=>status(i.id)==="known").length} cards known well.</p>
  </div><div class="study-foot"><div class="row"><button class="btn ghost" id="again" style="flex:1">Another test</button><button class="btn" id="done" style="flex:1">Done</button></div></div></div>`;
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>speak(R(BY_ID[b.dataset.id].bg).text));
  document.getElementById("done").onclick=()=>{ test=null; render(); };
  document.getElementById("again").onclick=()=>{ test=null; startTest(); };
}

/* =====================================================================
   GAMES — built only from words and sentences you've started
   ===================================================================== */
const GAMES=[
  {id:"match", bg:"Чифтове", en:"Pairs", desc:"Match six Bulgarian words to their meanings. Fast and few mistakes scores highest.",
    lock:()=>{ const n=startedWordItems().length; return n>=6?"":`Start ${6-n} more word${6-n===1?"":"s"} to unlock.`; }},
  {id:"speed", bg:"Бързо!", en:"Speed round", desc:"60 seconds of meanings. Every 3 in a row raises your multiplier; a miss costs 3 seconds.",
    lock:()=>{ const n=startedWordItems().length; return n>=8?"":`Start ${8-n} more words to unlock.`; }},
  {id:"tf", bg:"Вярно или не", en:"True or false", desc:"45 seconds. Is the translation right? Trust your gut.",
    lock:()=>{ const n=startedWordItems().length; return n>=8?"":`Start ${8-n} more words to unlock.`; }},
  {id:"listen", bg:"Ухо", en:"Ear training", desc:"Hear a word, tap how it's written. Quick answers earn a bonus.",
    lock:()=>{ if(!hasVoice()) return "Needs a Bulgarian voice (see More → Voice)."; const n=startedWordItems().length; return n>=8?"":`Start ${8-n} more words to unlock.`; }},
  {id:"build", bg:"Подреди", en:"Sentence builder", desc:"Put the words back in order. Six sentences, three lives.",
    lock:()=>{ const n=startedSentItems().length; return n>=3?"":`Unlocks after 3 sentences appear in your lessons (${n} so far).`; }},
  {id:"gap", bg:"Липсва дума", en:"Missing word", desc:"Pick the word that completes the sentence. Streaks earn bonus points.",
    lock:()=>{ const n=startedSentItems().length; return n>=4?"":`Unlocks after 4 sentences appear in your lessons (${n} so far).`; }}
];
const GBY=Object.fromEntries(GAMES.map(g=>[g.id,g]));
function renderGames(){
  const nw=startedWordItems().length, ns=startedSentItems().length;
  app.innerHTML=`<div class="wrap">
    <h2>Games</h2>
    <p class="muted small">Every game uses only what you've already met: ${nw} words and ${ns} sentences so far. They grow as you learn.</p>
    <ul class="glist">${GAMES.map(g=>{ const lk=g.lock(), rec=S.games[g.id]; return `<li><button data-game="${g.id}" ${lk?"disabled":""}>
      <span class="gt"><span class="bg" lang="bg">${esc(g.bg)}</span> <span class="muted">${esc(g.en)}</span></span>
      <span class="gd">${esc(lk||g.desc)}</span>
      ${rec&&!lk?`<span class="gb">Best ${rec.best} — played ${rec.plays} time${rec.plays===1?"":"s"}</span>`:""}
    </button></li>`; }).join("")}</ul>
  </div>`;
  app.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>startGame(b.dataset.game));
}
function stopGameTimers(){ if(game){ clearInterval(game.iv); clearTimeout(game.to); } }
function startGame(id){
  stopGameTimers();
  const W=shuffle(startedWordItems()), base={id, score:0, over:false, streak:0, best:0, right:0, wrong:0};
  if(id==="match"){
    const short=W.filter(w=>plain(w.bg).length<=16 && w.en.length<=26);
    const ws=(short.length>=6?short:W).slice(0,6);
    game={...base, tiles:shuffle([...ws.map(w=>({it:w,side:"bg"})),...ws.map(w=>({it:w,side:"en"}))]), sel:null, done:[], bad:[], mistakes:0, start:Date.now()};
    game.iv=setInterval(()=>{ const c=document.getElementById("clock"); if(c && game) c.textContent=((Date.now()-game.start)/1000).toFixed(0)+"s"; },250);
  }
  if(id==="speed"||id==="tf"){
    const dur=id==="speed"?60000:45000;
    game={...base, pool:W, end:Date.now()+dur, dur, recent:[]};
    id==="speed"?nextSpeed():nextTF();
    game.iv=setInterval(gameTick,200);
  }
  if(id==="listen"){ game={...base, pool:W, round:0, rounds:10, recent:[]}; nextListen(); }
  if(id==="build"){ game={...base, pool:shuffle(startedSentItems()), round:0, rounds:6, lives:3}; nextBuild(); }
  if(id==="gap"){ game={...base, pool:shuffle(startedSentItems()), round:0, rounds:8}; nextGap(); }
  render();
}
function freshPick(pool,recent,keep){ const c=pool.filter(x=>!recent.includes(x.id)); const it=pick(c.length?c:pool); recent.push(it.id); if(recent.length>keep) recent.shift(); return it; }
function gameTick(){
  if(!game || game.over) return;
  const left=game.end-Date.now();
  if(left<=0){ finishGame(); return; }
  const c=document.getElementById("clock"), b=document.getElementById("tbar");
  if(c) c.textContent=Math.ceil(left/1000)+"s";
  if(b) b.style.width=(100*left/game.dur)+"%";
}
function finishGame(){
  if(!game || game.over) return;
  stopGameTimers(); game.over=true;
  const rec=S.games[game.id]||{best:0,plays:0,at:0};
  game.newBest = game.score>rec.best && rec.plays>0;
  S.games[game.id]={best:Math.max(rec.best,game.score), plays:rec.plays+1, at:Date.now()};
  game.prevBest=rec.best;
  save(); render();
}
function nextSpeed(){ const it=freshPick(game.pool,game.recent,Math.min(8,game.pool.length-1)); game.q={it, opts:shuffle([it,...distractors(it,3,game.pool)]), pick:null}; }
function nextTF(){ const it=freshPick(game.pool,game.recent,Math.min(8,game.pool.length-1)); const truth=Math.random()<0.5; game.q={it, truth, shown: truth?it.en:(distractors(it,1,game.pool)[0]||it).en, pick:null}; if(!truth && game.q.shown===it.en) game.q.truth=true; }
function nextListen(){ const it=freshPick(game.pool,game.recent,Math.min(6,game.pool.length-1)); game.q={it, opts:shuffle([it,...lookalikes(it,3,game.pool)]), pick:null, t0:Date.now()}; game.round++; }
function nextBuild(){ const it=game.pool[game.round%game.pool.length]; const words=sentWords(it.bg); game.q={it, words, chips:shuffle(words.map((w,k)=>({w:chipText(w,k),k}))), ans:[], tries:0, done:false}; game.round++; }
function nextGap(){ const it=game.pool[game.round%game.pool.length]; game.q={it, ...makeGap(it), pick:null}; game.round++; }
function gameHUD(extra){
  const g=game, timed=g.id==="speed"||g.id==="tf";
  return `<div class="study-top"><button class="x" id="quit">✕ Quit</button>
    ${timed?`<div class="bar"><i id="tbar" style="width:${Math.max(0,100*(g.end-Date.now())/g.dur)}%"></i></div>`:`<div style="flex:1"></div>`}
    <span class="hudnum" id="clock">${timed?Math.ceil(Math.max(0,g.end-Date.now())/1000)+"s":g.id==="match"?((Date.now()-g.start)/1000).toFixed(0)+"s":""}</span></div>
    <div class="hud"><span>Score <strong>${g.score}</strong></span>${extra||""}</div>`;
}
function renderGame(){
  const g=game; if(g.over) return renderGameOver();
  const meta=GBY[g.id]; let body="";
  if(g.id==="match"){
    body=`<div class="tiles">${g.tiles.map((t,i)=>`<button data-t="${i}" class="tile ${t.side} ${g.sel===i?"sel":""} ${g.done.includes(i)?"done":""} ${g.bad.includes(i)?"bad":""}" ${g.done.includes(i)?"disabled":""} ${t.side==="bg"?'lang="bg"':""}>${t.side==="bg"?esc(plain(t.it.bg)):esc(t.it.en)}</button>`).join("")}</div>`;
    app.innerHTML=`<div class="study">${gameHUD(`<span>Mistakes <strong>${g.mistakes}</strong></span>`)}<div class="stage gstage"><div class="kind">${esc(meta.en)} — tap a Bulgarian word, then its meaning</div>${body}</div></div>`;
  }
  if(g.id==="speed"){
    const q=g.q, r=R(q.it.bg), mult=Math.min(5,1+Math.floor(g.streak/3));
    body=`<div class="big ${sizeFor(r.text)} bg" lang="bg">${r.cyr}</div>${HW(q.it.bg,"card "+sizeFor(r.text))}
      <div class="choices">${q.opts.map((o,k)=>`<button data-o="${k}" class="${q.pick!==null?(o===q.it?"right":(q.pick===k?"wrong":"")):""}" ${q.pick!==null?"disabled":""}>${esc(o.en)}</button>`).join("")}</div>`;
    app.innerHTML=`<div class="study">${gameHUD(`<span class="mult ${mult>1?"on":""}">×${mult}</span>`)}<div class="stage gstage">${body}</div></div>`;
  }
  if(g.id==="tf"){
    const q=g.q, r=R(q.it.bg);
    body=`<div class="big ${sizeFor(r.text)} bg" lang="bg">${r.cyr}</div>${HW(q.it.bg,"card "+sizeFor(r.text))}
      <div class="tfshown ${q.pick!==null?(q.pick===q.truth?"ok":"no"):""}">= ${esc(q.shown)}</div>
      ${q.pick!==null&&!q.truth?`<p class="muted">It means: ${esc(q.it.en)}</p>`:""}
      <div class="tfbtns"><button id="tfno" class="no" ${q.pick!==null?"disabled":""}>✗ Wrong</button><button id="tfyes" class="yes" ${q.pick!==null?"disabled":""}>✓ Right</button></div>`;
    app.innerHTML=`<div class="study">${gameHUD(`<span>Streak <strong>${g.streak}</strong></span>`)}<div class="stage gstage">${body}</div></div>`;
  }
  if(g.id==="listen"){
    const q=g.q;
    body=`<div class="kind">Round ${g.round} of ${g.rounds}</div><div class="row"><button class="icon-btn big-play" id="replay">▶ Play</button><button class="linkish" id="slow">Slowly</button></div>
      <div class="choices bgc">${q.opts.map((o,k)=>`<button data-o="${k}" class="${q.pick!==null?(o===q.it?"right":(q.pick===k?"wrong":"")):""}" ${q.pick!==null?"disabled":""} lang="bg">${R(o.bg).cyr}</button>`).join("")}</div>
      ${q.pick!==null?`<p class="mean" style="margin-top:12px">${esc(q.it.en)} <span class="phon">${R(q.it.bg).phon}</span></p>`:""}`;
    app.innerHTML=`<div class="study">${gameHUD()}<div class="stage gstage">${body}</div>${q.pick!==null?`<div class="study-foot"><button class="btn wide" id="gnext">${g.round>=g.rounds?"See score":"Next"}</button></div>`:""}</div>`;
  }
  if(g.id==="build"){
    const q=g.q, r=R(q.it.bg);
    body=`<div class="kind">Sentence ${g.round} of ${g.rounds}</div><div class="en-big" style="font-size:22px">${esc(q.it.en)}</div>
      <div class="answer ${q.done?(q.ok?"ok":"no"):""}" lang="bg">${q.ans.map((ci,k)=>`<button class="chipw" data-a="${k}" ${q.done?"disabled":""}>${esc(q.chips[ci].w)}</button>`).join("")||`<span class="muted small">Tap the words below</span>`}</div>
      <div class="bank" lang="bg">${q.chips.map((c,ci)=>`<button class="chipw ${q.ans.includes(ci)?"used":""}" data-c="${ci}" ${q.done||q.ans.includes(ci)?"disabled":""}>${esc(c.w)}</button>`).join("")}</div>
      ${q.done&&!q.ok?`<p style="margin-top:12px">Correct order: <span lang="bg" style="font-size:20px">${r.cyr}</span></p>`:""}`;
    const foot = q.done ? `<button class="btn wide" id="gnext">${g.lives<=0||g.round>=g.rounds?"See score":"Next sentence"}</button>`
                        : `<button class="btn wide" id="gcheck" ${q.ans.length===q.chips.length?"":"disabled"}>Check</button>`;
    app.innerHTML=`<div class="study">${gameHUD(`<span class="lives">${"♥".repeat(Math.max(0,g.lives))}<span class="muted">${"♥".repeat(3-Math.max(0,g.lives))}</span></span>`)}<div class="stage gstage">${body}</div><div class="study-foot">${foot}</div></div>`;
  }
  if(g.id==="gap"){
    const q=g.q;
    body=`<div class="kind">Sentence ${g.round} of ${g.rounds}</div><div class="gapline" lang="bg">${gapHTML(q.it.bg,q.gapK,q.pick!==null?q.gapWord:null)}</div><p class="muted">${esc(q.it.en)}</p>
      <div class="choices bgc">${q.gapOpts.map((o,k)=>`<button data-g="${k}" class="${q.pick!==null?(o===q.gapWord?"right":(q.pick===k?"wrong":"")):""}" ${q.pick!==null?"disabled":""} lang="bg">${esc(o)}</button>`).join("")}</div>`;
    app.innerHTML=`<div class="study">${gameHUD(`<span>Streak <strong>${g.streak}</strong></span>`)}<div class="stage gstage">${body}</div>${q.pick!==null?`<div class="study-foot"><button class="btn wide" id="gnext">${g.round>=g.rounds?"See score":"Next"}</button></div>`:""}</div>`;
  }
  wireGame();
}
function wireGame(){
  const g=game, $=id=>document.getElementById(id);
  $("quit").onclick=()=>{ stopGameTimers(); stopRecording(); game=null; render(); };
  if(g.id==="match") app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.t; if(g.done.includes(i)) return;
    if(g.sel===null || g.sel===i){ g.sel = g.sel===i?null:i; render(); return; }
    const a=g.tiles[g.sel], c=g.tiles[i];
    if(a.it===c.it && a.side!==c.side){
      g.done.push(g.sel,i); g.sel=null; beep(true); if(hasVoice()) speak(R(a.it.bg).text);
      if(g.done.length===g.tiles.length){ const secs=(Date.now()-g.start)/1000; g.secs=Math.round(secs); g.score=Math.max(50,Math.round(1000-secs*10-g.mistakes*50)); finishGame(); return; }
    } else if(a.side===c.side){ g.sel=i; }
    else { g.mistakes++; g.bad=[g.sel,i]; g.sel=null; beep(false); g.to=setTimeout(()=>{ if(game===g){ g.bad=[]; render(); } },450); }
    render();
  });
  if(g.id==="speed") app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    const q=g.q; if(q.pick!==null) return; q.pick=+b.dataset.o;
    if(q.opts[q.pick]===q.it){ g.streak++; g.right++; g.score+=10*Math.min(5,1+Math.floor((g.streak-1)/3)); beep(true); }
    else { g.streak=0; g.wrong++; g.end-=3000; beep(false); }
    render(); g.to=setTimeout(()=>{ if(game===g && !g.over){ nextSpeed(); render(); } }, q.opts[q.pick]===q.it?280:900);
  });
  if(g.id==="tf"){ const ans=v=>{ const q=g.q; if(q.pick!==null) return; q.pick=v;
      if(v===q.truth){ g.streak++; g.right++; g.score+=10+5*Math.min(4,Math.floor(g.streak/4)); beep(true); } else { g.streak=0; g.wrong++; beep(false); }
      render(); g.to=setTimeout(()=>{ if(game===g && !g.over){ nextTF(); render(); } }, v===q.truth?250:1100); };
    if($("tfyes")) $("tfyes").onclick=()=>ans(true);
    if($("tfno")) $("tfno").onclick=()=>ans(false);
  }
  if(g.id==="listen"){
    const q=g.q, txt=R(q.it.bg).text;
    if($("replay")) $("replay").onclick=()=>speak(txt);
    if($("slow")) $("slow").onclick=()=>speak(txt,0.6);
    app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ if(q.pick!==null) return; q.pick=+b.dataset.o;
      if(q.opts[q.pick]===q.it){ const secs=(Date.now()-q.t0)/1000; g.right++; g.score+=100+Math.max(0,Math.round(50-secs*8)); beep(true); } else { g.wrong++; beep(false); }
      render(); });
    if($("gnext")) $("gnext").onclick=()=>{ if(g.round>=g.rounds){ finishGame(); return; } nextListen(); render(); speak(R(g.q.it.bg).text); };
    if(!q.played){ q.played=true; setTimeout(()=>speak(txt),250); }
  }
  if(g.id==="build"){
    const q=g.q;
    app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ q.ans.push(+b.dataset.c); render(); });
    app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ q.ans.splice(+b.dataset.a,1); render(); });
    if($("gcheck")) $("gcheck").onclick=()=>{
      q.ok = q.ans.map(ci=>q.chips[ci].w.toLowerCase()).join(" ")===q.words.map(w=>w.toLowerCase()).join(" ");
      q.done=true; if(q.ok){ g.right++; g.score+=100+20*q.words.length; beep(true); } else { g.wrong++; g.lives--; beep(false); }
      if(hasVoice()) speak(R(q.it.bg).text); render(); };
    if($("gnext")) $("gnext").onclick=()=>{ if(g.lives<=0||g.round>=g.rounds){ finishGame(); return; } nextBuild(); render(); };
  }
  if(g.id==="gap"){
    const q=g.q;
    app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ if(q.pick!==null) return; q.pick=+b.dataset.g;
      if(q.gapOpts[q.pick]===q.gapWord){ g.streak++; g.right++; g.score+=100+20*Math.min(5,g.streak-1); beep(true); } else { g.streak=0; g.wrong++; beep(false); }
      if(hasVoice()) speak(R(q.it.bg).text); render(); });
    if($("gnext")) $("gnext").onclick=()=>{ if(g.round>=g.rounds){ finishGame(); return; } nextGap(); render(); };
  }
}
function renderGameOver(){
  const g=game, meta=GBY[g.id], best=S.games[g.id]?.best||g.score;
  const stats = g.id==="match" ? `${g.secs}s, ${g.mistakes} mistake${g.mistakes===1?"":"s"}` : `${g.right} right, ${g.wrong} wrong`;
  app.innerHTML=`<div class="study"><div class="stage done">
    <div class="kind"><span lang="bg">${esc(meta.bg)}</span> — ${esc(meta.en)}</div>
    <div class="big s1">${g.score}</div>
    <p style="font-size:19px">${g.newBest?"New best score!":`Best: ${best}`}</p>
    <p class="muted">${stats}</p>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn ghost" id="gback">All games</button><button class="btn" id="gagain">Play again</button></div>
  </div></div>`;
  document.getElementById("gback").onclick=()=>{ game=null; view="games"; render(); };
  document.getElementById("gagain").onclick=()=>startGame(g.id);
  if(g.newBest) beep(true);
}

render();
if(syncOn()) sync();
if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(()=>{});
